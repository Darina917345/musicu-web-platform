<main id="main" class="container">
<h1>Зворотний зв'язок</h1>
<p>Напишіть нам, якщо маєте питання чи пропозицію.</p>

<form class="form" action="#" method="post" id="contact-form">
  <label for="name">Ім'я</label>
  <input type="text" id="name" name="name" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>

  <label for="topic">Тема звернення</label>
  <select id="topic" name="topic">
    <option value="question">Питання</option>
    <option value="bug">Помилка на сайті</option>
    <option value="album">Пропозиція альбому</option>
  </select>

  <label for="message">Повідомлення</label>
  <textarea id="message" name="message" rows="5" required></textarea>

  <p>Бажаний спосіб відповіді:</p>
  <label class="inline-label"><input type="radio" name="reply" value="email" checked> Email</label>
  <label class="inline-label"><input type="radio" name="reply" value="none"> Не потрібна</label>

  <label class="inline-label"><input type="checkbox" name="agree" value="1" required> Погоджуюсь з <a href="files/rules.txt" download>правилами</a></label>

  <button class="button" type="submit">Надіслати</button>
</form>
</main>
